[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llmdiff"
version = "0.1.0"
description = "Git diff for LLM outputs. Replay real production traffic against a new prompt or model and get a win/tie/loss verdict matrix."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "username9999-sys" }]
keywords = [
    "llm",
    "diff",
    "regression",
    "testing",
    "evaluation",
    "prompt",
    "ci",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
llmdiff = "llmdiff.cli:main"

[project.urls]
Homepage = "https://github.com/username9999-sys/llmdiff"
Repository = "https://github.com/username9999-sys/llmdiff"
Issues = "https://github.com/username9999-sys/llmdiff/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmdiff = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# dashboard HTML/JS is embedded as long string literals
"src/llmdiff/server/app.py" = ["E501"]
"src/llmdiff/server/storage.py" = ["E501"]
"tests/server/test_server.py" = ["E501"]
